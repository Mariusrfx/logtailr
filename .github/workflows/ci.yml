name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: build
        run: npm run build
      - name: test
        run: npm test

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t logtailr:ci .
      - name: Smoke test
        run: |
          docker run --rm -d --name logtailr-smoke -p 127.0.0.1:18080:8080 --entrypoint sh logtailr:ci \
            -c "touch /tmp/smoke.log && exec /usr/local/bin/logtailr tail --file /tmp/smoke.log --api --api-addr 0.0.0.0 --insecure-api"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health > /dev/null 2>&1; then
              curl -fsS http://127.0.0.1:18080/health
              exit 0
            fi
            sleep 1
          done
          docker logs logtailr-smoke
          exit 1
